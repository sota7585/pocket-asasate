# 平日の決まった時間に値上がり上位を取得して記録し、アプリ（GitHub Pages）を作り直す。Discord にも送る。
# 時刻は世界標準時（日本時間 −9時間）で書く。株価が約20分遅れなので、区切りの20分あとに動かす。
# GitHub の混み具合で、実際に動くのが数分〜十数分遅れることがある。
name: 値上がり速報

on:
  schedule:
    - cron: "0 22 * * 0-4"   # 日本時間  7:00 朝のまとめ（世界標準時では前の日の22時）
    - cron: "25 0 * * 1-5"   # 日本時間  9:25 朝の寄り付き後
    - cron: "50 2 * * 1-5"   # 日本時間 11:50 前場の終わり
    - cron: "55 3 * * 1-5"   # 日本時間 12:55 後場の寄り付き
    - cron: "55 6 * * 1-5"   # 日本時間 15:55 後場の終わり
  workflow_dispatch:          # GitHub の画面から手動で動かすとき
    inputs:
      timing:
        description: "区切り"
        type: choice
        default: manual
        # site は株価を取りに行かず、アプリだけを作り直す（アプリの見た目を直したとき用）
        options: [manual, morning, open_am, close_am, open_pm, close_pm, site]

permissions:
  contents: write             # 取得した記録を保存するため
  pages: write                # アプリを公開するため
  id-token: write

# 2つが同時に動いて記録がぶつからないよう、1つずつ順番に動かす
concurrency:
  group: sokuho
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: どの区切りかを決める
        id: timing
        run: |
          case "${{ github.event.schedule }}" in
            "0 22 * * 0-4") t=morning ;;
            "25 0 * * 1-5") t=open_am ;;
            "50 2 * * 1-5") t=close_am ;;
            "55 3 * * 1-5") t=open_pm ;;
            "55 6 * * 1-5") t=close_pm ;;
            *) t="${{ inputs.timing }}" ;;
          esac
          echo "value=${t:-manual}" >> "$GITHUB_OUTPUT"

      - name: 取得してお知らせ
        if: steps.timing.outputs.value != 'site'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scheduled_run.py ${{ steps.timing.outputs.value }}

      - name: 記録を保存
        if: steps.timing.outputs.value != 'site'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data   # 古い記録を消した分も反映する
          git diff --cached --quiet || git commit -m "記録 ${{ steps.timing.outputs.value }}"
          git pull --rebase
          git push

      - name: アプリを組み立てる
        run: python build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: アプリを公開する
        id: deploy
        uses: ac
